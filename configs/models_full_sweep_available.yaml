# Models available on the sweep host (RTX 4090 24 GB).
#
# Generation settings follow each vendor's published recommendation as
# documented by Unsloth. Reasoning-capable models run with reasoning enabled;
# the remaining models have no reasoning mode.
#
# Qwen 3.5 / 3.6 (thinking, precise coding): 0.6 / 0.95 / 20 / min_p 0
#   https://unsloth.ai/docs/models/qwen3.5.md
#   https://unsloth.ai/docs/models/qwen3.6.md
# Qwen 3.8 (thinking; reasoning_effort, xhigh is the vendor default):
#   https://unsloth.ai/docs/models/qwen3.8.md
# Gemma 4: https://unsloth.ai/docs/models/gemma-4.md
# gpt-oss: https://unsloth.ai/docs/models/gpt-oss-how-to-run-and-fine-tune.md
# Mistral Small 3.2: unsloth GGUF model card (0.15 / 1.0 / top_k off)
# Phi-4: https://unsloth.ai/docs/models/tutorials/phi-4-reasoning-how-to-run-and-fine-tune.md
# Llama 3.1: Meta model card (no Unsloth run guide published)

models:
  qwen35_2b_q4:
    family: qwen3.5
    size_b: 2
    architecture: dense
    local: true
    backend: llamacpp
    base_url: http://127.0.0.1:8081/v1
    model_name: qwen35-2b-q4
    quantization: Q4_K_M
    context_length: 131072
    tool_protocol: native
    source_repo: unsloth/Qwen3.5-2B-GGUF
    artifact_repo: local:/path/to/model.gguf
