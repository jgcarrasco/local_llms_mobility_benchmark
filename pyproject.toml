[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mobility-agent-benchmark"
version = "1.1.2"
description = "Controlled benchmark for local LLM agents on mobility data engineering tasks."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "matplotlib",
  "numpy",
  "pandas",
  "pydantic",
  "pyyaml",
  "rdflib",
  "requests",
  "scikit-learn",
]

[project.optional-dependencies]
test = [
  "pytest",
]
analysis = [
  "statsmodels",
]

[project.scripts]
mobility-bench = "mobility_bench.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.hatch.build.targets.wheel]
packages = ["src/mobility_bench"]
